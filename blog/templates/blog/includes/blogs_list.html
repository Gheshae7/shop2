{% load jformat %}
{% load base_tags %}

{% for blog in blogs %}
    <a href="{% url "blog:blog_detail_page" slug=blog.slug %}" class="block group relative">
        <!-- هاله نوری محو پشت کارت که با هاور فعال‌تر می‌شود -->
        <div
            class="absolute -inset-0.5 bg-gradient-to-br from-blue-400/0 via-blue-400/0 to-blue-400/0 group-hover:from-blue-400/20 group-hover:via-transparent group-hover:to-blue-400/20 rounded-3xl blur-xl transition-all duration-700 opacity-0 group-hover:opacity-100">
        </div>

        <!-- بدنه اصلی کارت (گلس‌مورفیسم) -->
        <div
            class="relative bg-white/40 backdrop-blur-xl transition-all duration-500 shadow-[0_8px_30px_rgb(0,0,0,0.04)] group-hover:shadow-[0_20px_40px_rgba(35,219,144,0.15)] group-hover:-translate-y-2 w-full p-4 md:p-5 rounded-[2rem] overflow-hidden border border-white/60 group-hover:border-blue-200/50 group-hover:bg-gradient-to-br group-hover:from-white/60 group-hover:to-blue-50/40 z-10">

            <!-- افکت نوری متحرک داخل کارت -->
            <div
                class="absolute inset-0 bg-gradient-to-r from-blue-500/0 via-white/40 to-blue-500/0 opacity-0 group-hover:opacity-100 -translate-x-full group-hover:translate-x-full transition-all duration-1000 ease-in-out pointer-events-none z-20">
            </div>

            <div class="relative overflow-hidden rounded-[1.5rem] md:rounded-[1.5rem] shadow-sm">
                <img class="w-full object-cover h-[160px] sm:h-[180px] md:h-[200px] group-hover:scale-110 group-hover:rotate-1 transition-transform duration-700 ease-out"
                    src="{{ blog.image.url }}" alt="{{ blog.name|truncatechars:20 }}" loading="lazy">

                <!-- گرادیانت روی عکس -->
                <div
                    class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-[1.5rem]">
                </div>

                <!-- زمان مطالعه (میکرو-اینتراکشن: ورود از پایین با تاخیر) -->
                <div
                    class="absolute bottom-3 right-3 bg-black/40 backdrop-blur-md border border-white/10 text-white px-3 py-1.5 rounded-2xl opacity-0 group-hover:opacity-100 translate-y-4 group-hover:translate-y-0 transition-all duration-500 delay-75 flex items-center gap-1.5 shadow-lg z-10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="text-[10px] sm:text-[11px] font-medium mt-[2px]">{{ blog.reading_time }} دقیقه مطالعه</span>
                </div>

                <!-- تگ دسته‌بندی گلس (میکرو-اینتراکشن: پرش به بالا در هاور) -->
                <span
                    class="absolute top-3 left-3 bg-blue-500/10 backdrop-blur-md border border-blue-400/30 text-blue-700 text-[10px] sm:text-[11px] px-3 py-1 rounded-full font-bold shadow-sm transition-transform duration-500 group-hover:-translate-y-1 z-10">
                    {{ blog.category.name }}
                </span>
            </div>

            <div class="mt-4 sm:mt-5 md:mt-6 relative">
                <!-- خط تزئینی بالای عنوان -->
                <div
                    class="absolute -top-2 left-0 w-0 group-hover:w-16 h-0.5 bg-gradient-to-r from-blue-400 to-blue-500 rounded-full transition-all duration-700 ease-out">
                </div>

                <h3
                    class="text-[14px] sm:text-[15px] font-extrabold text-gray-800 group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-blue-600 group-hover:to-blue-600 transition-all duration-300 line-clamp-2 leading-tight md:leading-snug">
                    {{ blog.name }}
                </h3>

                <p
                    class="text-[11px] sm:text-[12px] text-gray-500 mt-2 md:mt-3 line-clamp-2 leading-relaxed group-hover:text-gray-700 transition-colors duration-300">
                    {{ blog.short_text }}
                </p>
            </div>

            <!-- بخش فوتر (دارای میکرو-اینتراکشن‌های مجزا برای هر آیکون) -->
            <div
                class="mt-4 sm:mt-5 md:mt-6 pt-4 border-t border-gray-200/50 group-hover:border-blue-200/50 transition-colors duration-300">
                <div class="flex items-center justify-between">

                    <!-- تاریخ -->
                    <div
                        class="flex items-center gap-1.5 text-gray-400 text-[10px] sm:text-[11px] group-hover:text-gray-500 transition-colors duration-300">
                        <img class="w-[14px] sm:w-[16px] opacity-70 group-hover:opacity-100 transition-opacity"
                            src="./assets/images/blog/calendar-2.svg" alt="">
                        <span class="mt-0.5">{{ blog.created_at|jformat:"%-d / %-m / %Y" }}</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <!-- لایک -->
                        <div
                            class="group/like flex items-center gap-1 text-[11px] sm:text-[12px] cursor-pointer">
                            <div
                                class="relative inline-flex items-center p-1 rounded-full group-hover/like:bg-red-50 transition-colors duration-300">
                                <svg class="w-4 h-4 text-red-400 group-hover/like:text-red-500 group-hover/like:scale-125 transition-all duration-300"
                                    viewBox="0 0 16 16" fill="currentColor">
                                    <path
                                        d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z" />
                                </svg>
                            </div>
                            <span
                                class="text-xs font-bold text-gray-500 group-hover/like:text-red-500 transition-colors mt-0.5">{{ blog.count_like }}</span>
                        </div>

                        <!-- کامنت -->
                        <div
                            class="group/comment flex items-center gap-1 text-[11px] sm:text-[12px] text-gray-400 cursor-pointer">
                            <div
                                class="p-1 rounded-full group-hover/comment:bg-blue-50 transition-colors duration-300">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    class="text-gray-400 group-hover/comment:text-blue-500 group-hover/comment:-translate-y-0.5 transition-all duration-300"
                                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z" />
                                </svg>
                            </div>
                            <span
                                class="font-bold group-hover/comment:text-blue-500 transition-colors mt-0.5">45</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- خط پایین انیمیشن -->
            <div
                class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 group-hover:w-1/3 h-[3px] bg-gradient-to-r from-transparent via-blue-400 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-700 ease-in-out">
            </div>
        </div>
    </a>
{% endfor %}
